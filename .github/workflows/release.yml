name: Release

# Triggers on a pushed version tag like v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Releases, upload assets, and push formula update

jobs:
  build:
    name: Build macOS binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # reads the Go version from go.mod automatically

      - name: Build binary (Apple Silicon / arm64)
        # CGO_ENABLED=1 is required because we use CGo (CoreGraphics, IOKit).
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" -o keymaprd_darwin_arm64 ./cmd/keymaprd/

      - name: Build binary (Intel / amd64)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            go build -ldflags="-s -w" -o keymaprd_darwin_amd64 ./cmd/keymaprd/

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keymaprd_darwin_arm64
            keymaprd_darwin_amd64
            config.example.json
          generate_release_notes: true

      - name: Update Homebrew formula in tap
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARBALL_URL="https://github.com/choolake/KeyMaprd/archive/refs/tags/${VERSION}.tar.gz"

          # Compute sha256 of the release tarball
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')

          # Clone the tap repo using deploy token
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/choolake/homebrew-tap.git tap-repo
          cd tap-repo

          # Update url and sha256 in the formula
          sed -i '' \
            "s|url \".*\"|url \"${TARBALL_URL}\"|" \
            Formula/keymaprd.rb
          sed -i '' \
            "s|sha256 \".*\"|sha256 \"${SHA256}\"|" \
            Formula/keymaprd.rb

          echo "Updated formula: url=${TARBALL_URL} sha256=${SHA256}"

          # Commit and push back to the tap repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/keymaprd.rb
          git diff --cached --quiet || git commit -m "chore: update keymaprd to ${VERSION}"
          git push origin main

